<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation bar</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: black;
            color: wheat;
            position: relative;
            top: 0;
            width: 100%;
            height: 50px;
            padding: 10px 50px;
        }
        ul{
            position: absolute;
            width: 300px;
        }
        ul li{
            list-style-type: none;
            display: inline-block;
        }
        nav{
            position: absolute;
            top: 10px;
            right: 200px;
        }
        a{
            text-decoration: none;
            color: white;
        }
    </style>

</head>
<body>
    <header>
        <h2>Paul St.</h2>
        <nav>
            <ul>
               <li><a href="font.html">Home</a></li>
               <li><a href="index.html">About</a></li>
               <li><a href="love.html">Contact</a></li>
               <li><a href="position.html">Signup</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
