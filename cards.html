<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            border: 2px solid black;
            width: 200px;
            height: 300px;
            position: relative;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 3px 3px 3px 5px gray, 4px 4px 4px 6px pink;
        }
        img{
            width: 100%;
            height:40%;
        }
        .btn1, .btn2{
            position: absolute;
            background-color: blueviolet;
            height: 30px;
            color: bisque;
        }
        .btn1{
            left: 5px;
            bottom: 2px;
        }
        .btn2{
            right: 5px;
            bottom: 2px;
        }
        button:hover{
            background-color: brown;
            color: white;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="female_shoe.jpg" alt="">
        <h3>Female Shoe</h3>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. In perspiciatis beatae </p>
        <button class="btn1">Read More</button> <button class="btn2">Add to cart</button>
    </div>
</body>
</html>
