<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" name="" id="Today">
    <div>Today is: <span id="dayOfWeek"></span></div>
    <button onclick="showDay()">click to see day</button>

    <script>
        let dayOfWeek = document.getElementById('dayOfWeek');
        let Today = document.getElementById('Today');


        function showDay(){
            let day = Today.value;

            switch(day){
                case "Monday":
                    dayOfWeek.innerHTML = `${day}`;
                    break;
                case "Tuesday": 
                    dayOfWeek.innerHTML = `${day}`;
                    break;
                case "Wednesday":
                    dayOfWeek.innerHTML = `${day}`;
                    break;
                case "Thursday": 
                    dayOfWeek.innerHTML = `${day}`;
                    break;
                case "Friday": 
                    dayOfWeek.innerHTML = `${day}`;
                    break;
                case "Saturday": 
                    dayOfWeek.innerHTML = `Weekend`;
                    break;
                case "Sunday": 
                    dayOfWeek.innerHTML = `Weekend`;
                    break;
                    default:
                        dayOfWeek.innerHTML = `please ${day} is not a valid day of the week`;
            }
        }


    </script>
</body>
</html>
