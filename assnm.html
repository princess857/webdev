<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>5 Buttons with Image Arrow</title>
<style>
    body{
        font-family: Arial;
        background: #f5f5f5;
        padding: 30px;
        display: flex;
        justify-content: center;
    }

.main-container{
        width: 600px;
        background: white;
        padding: 20px;
        border-radius: 10px;
    }

.buttons-wrapper{
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

 button{
        width: 100%;
        padding: 15px;
        font-size: 16px;
        font-weight: bold;
        background: #7b2121;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-align: left;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

 button:hover{
        background: #287881;
    }

.dropdown-content{
        background: #f1f1f1;
        padding: 0 15px;
        max-height: 0;
        overflow: hidden;
        transition: 0.4s;
        color: #333;
        border-radius: 0 0 8px 8px;
        margin-top: -5px;
    }

.dropdown-content.show{
        padding: 15px;
        max-height: 200px;
    }

.arrow-img{ 
        width: 20px; 
        height: 20px;
        transition: 0.3s; 
    }

 button.active.arrow-img{
        transform: rotate(180deg);
    }
</style>
</head>
<body>

    <div class="main-container">

        <div class="buttons-wrapper">

            <button onclick="Dropdown(1)">
               How to start a blog?
                <img src="arrow_icon.png" alt="">
            </button>
            <div id="drop1" class="dropdown-content">
               Pick 1 topic. Use WordPress. Post 2x per week. Be consistent.
            </div>

           
            <button onclick="Dropdown(2)">
                How do bloggers earn money?
                <img src="arrow_icon.png" alt="">
            </button>
            <div id="drop2" class="dropdown-content">
               Ads, Affiliate links, Sponsored posts, Selling products.
            </div>

           
            <button onclick="Dropdown(3)">
                How long to get traffic?
                <img src="arrow_icon.png" alt="">
            </button>
            <div id="drop3" class="dropdown-content">
               About 3-6 months with regular posts and SEO.
            </div>

            
            <button onclick="Dropdown(4)">
               Do I need to be a good writer?
                <img src="arrow_icon.png" alt="">
            </button>
            <div id="drop4" class="dropdown-content">
               No. Just be clear and helpful. Write like you talk.
            </div>

           
            <button onclick="Dropdown(5)">
                Blog vs Vlog?
                <img src="arrow_icon.png" alt="">
            </button>
            <div id="drop5" class="dropdown-content">
               Blog contains written articles. <br>
               Vlog contains video content.
            </div>

        </div>
    </div>

<script>
    function Dropdown(num){
        let btn = document.querySelectorAll("button")[num-1];
        let content = document.getElementById("drop" + num);

        if(content.classList.contains("show")){
            content.classList.remove("show");
            btn.classList.remove("active");
        }
        else {
            for(let i = 1; i <= 5; i++){
                document.getElementById("drop" + i).classList.remove("show");
            }
            let allBtns = document.querySelectorAll("button");
            for(let i = 0; i < allBtns.length; i++){
                allBtns[i].classList.remove("active");
            }

            content.classList.add("show");
            btn.classList.add("active");
        }
    }
</script>
&gt;

</body>
</html>
