<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cart{
            border: 2px solid black;
            width: 200px;
            height: 300px;
            position: relative;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 3px 3px 3px 5px grey, 4px 4px 4px 6px beige;
        }

        img{
            width: 100%;
            height: 40%;
        }

        .btn1, .btn2{
            position: absolute;
            background-color: deepskyblue;
            height: 30px;
            color: beige;
        }

        .btn1{
            left: 5px;;
            bottom: 2px;
        }

        .btn2{
            right: 5px;
            bottom: 2px;
        }

        button:hover{
            background-color: lightcoral;
            color: black;
        }
    </style>
</head>
<body>
  <div class="cart">
    <img src="female_shoe.jpg" alt="">
    <h3>Female Shoe</h3>
    <p>A beautiful female shoe. This product is worth everything trying. Do well to order from us.</p>
    <button class="btn1">Read More</button>
    <button class="btn2">Add to Cart</button>
  </div>  
</body>
</html>
