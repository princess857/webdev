<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a:link{
              text-decoration: underline 5px solid red; 
              color: red; /*underline, oerline, line-through */
        }
        a:visited{
            text-decoration: underline 5px solid gold; 
            color: aqua;
        }
        a:hover{
            text-decoration: underline 5px dotted green;
            color: green;
        }
        a:active{
            text-decoration: underline 5px dashed orange;
            color: orange;
        }
    </style>
</head>
<body>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.github.com">Go to GitHub</a>
</body>
</html>
