<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid-container{
            display: grid;
            border: 1px solid;
            margin: 30px auto;
            padding: 10px;
            width: 300px;
            min-height: 400px;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(6, 1fr);
            border-radius: 10px;
            gap: 5px;
            text-align: center;
            background-color: black;
            color: beige;
        }

        .grid-item{
            border: 1px solid;
            border-radius: 10px;
            min-height: 50px;
            /* display: grid; */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }

        .item0{
            grid-area: 1/1/2/5;
            background-color: grey;
            justify-content: flex-end;
            padding-right: 15px;
            cursor: default;
            font-size: 32px;
        }

        .itemi{
            grid-area:3/4/5/5;
            background-color: red;
            color: beige;
        }

        .item{
            background-color: red;
            grid-area: 6/2/7/5
        }

        .itemL{
            background-color: red;
        }

        div .grid-item:hover{
            color: rgba(226, 43, 153, 0.696);
            transition: 3s;
        }

        .itemC{
           background-color: red; 
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <button class="grid-item item0"></button> 
        <button class="grid-item itemC" onclick="calc('C')">C</button>
        <button class="grid-item" onclick="calc (9)">9</button>
        <button class="grid-item" onclick="calc (8)">8</button>
        <button class="grid-item itemL" onclick="calc('*')">X</button>
        <button class="grid-item" onclick="calc(7)">7</button>
        <button class="grid-item" onclick="calc(6)">6</button>
        <button class="grid-item" onclick="calc(5)">5</button>
        <button class="grid-item" onclick="calc(4)">4</button>
        <button class="grid-item" onclick="calc(3)">3</button>
        <button class="grid-item" onclick="calc(2)">2</button>
        <button class="grid-item" onclick="calc(1)">1</button>
        <button class="grid-item itemi" onclick="calc('+')">+</button>
        <button class="grid-item" onclick="calc(0)">0</button>
        <button class="grid-item" onclick="calc('/')">/</button>
        <button class="grid-item itemL" onclick="calc('-')">-</button>
        <button class="grid-item itemL" onclick="calc('.')">.</button>
        <button class="grid-item item" onclick="calc('=')">=</button>
    </div>
         
    <script>
    let display = document.querySelector('.item0');

    function calc(num){
        
        if(num == '='){
            display.innerHTML  = eval(display.innerHTML);
            return;
        }else if(num == 'C'){
            display.innerHTML = '';
            return;
        }else{
         display.innerHTML += num;
        }
    }
   </script>
</body>
</html>
