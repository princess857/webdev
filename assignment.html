<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid-container{
            display: grid;
            border: 1px solid;
            margin: 30px auto;
            padding: 10px;
            width: 300px;
            min-height: 400px;
            grid-template-columns: repeat(4, 1fr);
            border-radius: 10px;
            gap: 5px;
            text-align: center;
            background-color: black;
            color: beige;
        }

        .grid-item{
            border: 1px solid;
            border-radius: 10px;
            min-height: 50px;
            display: grid;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item0{
            grid-area: 1/1/2/5;
            background-color: grey;
        }

        .itemi{
            grid-area:3/4/5/5;
            background-color: red;
            color: beige;
        }

        .item{
            background-color: red;
            grid-area: 6/2/7/5
        }

        .itemL{
            background-color: red;
        }

        div .grid-item:hover{
            color: rgba(226, 43, 153, 0.696);
            transition: 3s;
        }

        .itemC{
           background-color: red; 
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <div class="grid-item item0">60</div>
        <div class="grid-item itemC">C</div>
        <div class="grid-item">9</div>
        <div class="grid-item">8</div>
        <div class="grid-item itemL">x</div>
        <div class="grid-item">7</div>
        <div class="grid-item">6</div>
        <div class="grid-item">5</div>
        <div class="grid-item">4</div>
        <div class="grid-item">3</div>
        <div class="grid-item">2</div>
        <div class="grid-item">1</div>
        <div class="grid-item itemi">+</div>
        <div class="grid-item">0</div>
        <div class="grid-item">/</div>
        <div class="grid-item itemL">-</div>
        <div class="grid-item itemL">.</div>
        <div class="grid-item item">=</div>
    </div>
</body>
</html>
